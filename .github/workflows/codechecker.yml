name: CodeChecker

on:
    workflow_call:

env:
    CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules
    BUILD_DIR: build/codechecker

jobs:
    analyze:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Cache CPM
              uses: actions/cache@v5
              with:
                  path: ${{ env.CPM_SOURCE_CACHE }}
                  key: ${{ runner.os }}-cpm-${{ hashFiles('**/CMakeLists.txt') }}

            - name: Install Clang & tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y clang clang-tidy clang-tools cppcheck

            - name: Install CodeChecker
              run: |
                  pip3 install codechecker
                  CodeChecker version

            - name: Configure
              run: |
                  cmake \
                    -S test/unit \
                    -B ${{ env.BUILD_DIR }} \
                    -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                    -DCMAKE_BUILD_TYPE=Debug

            - name: Build
              run: cmake --build ${{ env.BUILD_DIR }} -j$(nproc)

            - name: CodeChecker analysis
              run: cmake --build ${{ env.BUILD_DIR }} --target codechecker

            - name: Upload SARIF
              uses: actions/upload-artifact@v6
              with:
                  name: codechecker-sarif
                  path: ${{ env.BUILD_DIR }}/codechecker/results.sarif

            - name: Upload HTML Report
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: codechecker-html
                  path: ${{ env.BUILD_DIR }}/codechecker/html
