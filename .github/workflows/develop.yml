name: Main

on:
    workflow_dispatch:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    style:
        uses: ./.github/workflows/style.yml
        secrets: inherit

    install:
        needs: [style]
        uses: ./.github/workflows/install.yml
        secrets: inherit

    unit-tests:
        needs: [style]
        uses: ./.github/workflows/unit-tests.yml
        secrets: inherit

    codechecker:
        needs: [style]
        uses: ./.github/workflows/codechecker.yml
        secrets: inherit

    integration-tests:
        needs: [unit-tests]
        uses: ./.github/workflows/integration-tests.yml
        secrets: inherit

    sonar-analysis:
        needs: [unit-tests, codechecker]
        uses: ./.github/workflows/sonar.yml
        secrets: inherit