name: Integration

on:
    workflow_call:

jobs:
    mcu-build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                mcu: [STM32F401RE]
        steps:
            - uses: actions/checkout@v5
            - name: Install Toolchain
              run: sudo apt update && sudo apt install -y gcc-arm-none-eabi
            - name: Build
              run: |
                  cmake -S test/integration -B build/int/${{ matrix.mcu }} \
                    -DMCU_NAME=${{ matrix.mcu }} \
                    --toolchain cmake/toolchains/arm-none-eabi-gcc.cmake
                  cmake --build build/int/${{ matrix.mcu }} -j$(nproc)
