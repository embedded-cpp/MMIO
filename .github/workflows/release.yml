name: Release

on:
    push:
        tags: ["v*.*.*"]

jobs:
    style:
        uses: ./.github/workflows/style.yml
        secrets: inherit

    install:
        needs: [style]
        uses: ./.github/workflows/install.yml
        secrets: inherit

    unit-tests:
        needs: [style]
        uses: ./.github/workflows/unit-tests.yml
        secrets: inherit

    codechecker:
        needs: [style]
        uses: ./.github/workflows/codechecker.yml
        secrets: inherit

    integration-tests:
        needs: [unit-tests]
        uses: ./.github/workflows/integration-tests.yml
        secrets: inherit

    sonar-analysis:
        needs: [unit-tests, codechecker]
        uses: ./.github/workflows/sonar.yml
        secrets: inherit

    documentation:
        permissions:
            contents: write
            pages: write
            id-token: write
        needs: [unit-tests, integration-tests]
        uses: ./.github/workflows/documentation.yml
        secrets: inherit

    create-release:
        permissions:
            contents: write
            pages: write
            id-token: write
        needs: [unit-tests, integration-tests, documentation]
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/')
        steps:
            - uses: actions/checkout@v5

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  generate_release_notes: true