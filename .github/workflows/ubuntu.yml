name: Ubuntu

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache CPM modules
        uses: actions/cache@v5
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: ${{ runner.os }}-cpm-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Install Tools
        run: sudo apt update && sudo apt install -y gcovr

      - name: Configure & Build
        run: |
          cmake -S test/unit -B build/unit \
            -DENABLE_TEST_COVERAGE=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/unit -j$(nproc)

      - name: Run Tests
        run: ctest --test-dir build/unit --output-on-failure

      - name: Generate Coverage
        run: cmake --build build/unit --target coverage

      - name: Upload Analysis Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonar-data
          path: |
            build/unit/compile_commands.json
            build/unit/sonarqube.xml
            include/

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mcu: [STM32F401RE]
    steps:
      - uses: actions/checkout@v6
      
      - name: Install ARM Toolchain
        run: sudo apt update && sudo apt install -y gcc-arm-none-eabi

      - name: Build Integration
        run: |
          cmake -S test/integration -B build/int-${{ matrix.mcu }} \
            -DMCU_NAME=${{ matrix.mcu }} \
            --toolchain cmake/toolchains/arm-none-eabi-gcc.cmake
          cmake --build build/int-${{ matrix.mcu }} -j$(nproc)
      
      # C'est ici que tu ajouteras Renode plus tard
      # - name: Run Renode Simulation
      #   run: ...

  # --- JOB 3 : ANALYSE SONARCLOUD (Indépendant de l'intégration) ---
  sonar-analysis:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Analysis Artifacts
        uses: actions/download-artifact@v4
        with:
          name: sonar-data
          path: .

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.cfamily.compile-commands=build/unit/compile_commands.json
            -Dsonar.coverageReportPaths=build/unit/sonarqube.xml