name: Ubuntu Pipeline

on:
    push:
        branches: [master, main]
    pull_request:
        branches: [master, main]

jobs:
    # 1. On lance les tests unitaires en premier
    unit-testing:
        uses: ./.github/workflows/unit-tests.yml
        secrets: inherit

    # 2. On lance l'intégration en parallèle des tests unitaires
    integration-testing:
        uses: ./.github/workflows/integration.yml
        secrets: inherit

    # 3. L'analyse Sonar ne se lance QUE si les tests unitaires réussissent
    sonar-analysis:
        needs: [unit-testing]
        uses: ./.github/workflows/sonar.yml
        secrets: inherit
