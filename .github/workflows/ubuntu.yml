name: Ubuntu

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened]

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules
  BUILD_DIR: build/test/unit

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Update to v4
        with:
          fetch-depth: 0

      - name: Cache CPM modules
        uses: actions/cache@v3
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: ${{ runner.os }}-cpm-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y gcovr gcc-arm-none-eabi

      # --- ÉTAPE 1 : TESTS UNITAIRES & COUVERTURE ---
      - name: Configure Unit Tests
        run: |
          cmake -S test/unit -B ${{ env.BUILD_DIR }} \
            -DENABLE_TEST_COVERAGE=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build & Run Tests
        run: |
          cmake --build ${{ env.BUILD_DIR }} -j$(nproc)
          ctest --test-dir ${{ env.BUILD_DIR }} --output-on-failure

      - name: Generate Coverage Report
        run: |
          cmake --build ${{ env.BUILD_DIR }} --target coverage

      # --- ÉTAPE 2 : TESTS D'INTÉGRATION (Compilation Cross-ARM) ---
      - name: Configure & Build Integration (STM32)
        run: |
          cmake -S test/integration -B build/test/integration \
            -DMCU_NAME=STM32F401RE \
            --toolchain cmake/toolchains/arm-none-eabi-gcc.cmake
          cmake --build build/test/integration -j$(nproc)

      # --- ÉTAPE 3 : ANALYSE SONAR ---
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.cfamily.compile-commands=${{ env.BUILD_DIR }}/compile_commands.json